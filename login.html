<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资料中心授权登录 - Mofort 摩垒</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #0a1c1b 0%, #123530 55%, #0b6b5f 100%); }
    .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 36px 30px; box-shadow: 0 18px 50px rgba(0,0,0,.28); text-align: center; }
    .login-card .brand-logo { margin: 0 auto 14px; height: 54px; }
    .login-card h1 { font-size: 20px; margin: 0 0 6px; color: #0a1c1b; }
    .login-card p { font-size: 13px; color: #678; margin: 0 0 22px; }
    .login-card .field { text-align: left; margin-bottom: 16px; }
    .login-card label { font-size: 13px; color: #345; display: block; margin-bottom: 6px; }
    .login-card input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid rgba(20,60,55,.25); border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    .login-card .btn { width: 100%; margin-top: 4px; }
    .login-error { background: #fdecea; color: #b3261e; border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
    .login-back { display: inline-block; margin-top: 16px; font-size: 13px; color: #0b6b5f; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="brand-logo" src="assets/images/logo-mofort.svg" alt="MoFort 摩垒注册商标">
      <h1>资料中心授权登录</h1>
      <p>资料中心包含产品手册、测试报告与项目资料，仅供授权客户与合作伙伴查阅。</p>
      <form id="loginForm">
        <div class="field">
          <label for="password">访问密码</label>
          <input id="password" name="password" type="password" required autofocus placeholder="请输入授权密码">
        </div>
        <button class="btn btn--primary" type="submit">进入资料中心</button>
      <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
          e.preventDefault();
          if (document.getElementById("password").value === "molei2026") {
            sessionStorage.setItem("molei_auth_ok", "1");
            location.href = "resources.html";
          } else { alert("密码错误，请重试"); }
        });
      </script>
      </form>
      <a class="login-back" href="index.html">← 返回首页</a>
    </div>
  </div>
</body>
</html>
